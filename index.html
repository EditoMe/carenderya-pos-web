<!--
  Carenderya POS — ITPFE 1 Prelim Project
  View framework (plain JavaScript, ES modules, MVC).
  No inline onclick anywhere: all user actions are wired by the controller.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carenderya POS — View Framework</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- View: login page (owner/staff) with QR owner login. -->
  <section class="login-view"></section>

  <div class="app" hidden>
    <!-- View: navigation rail. Owner: Member 1 -->
    <nav class="rail"></nav>

    <!-- View: POS terminal (menu grid + analytics + order summary). Owner: Member 1 -->
    <main class="pos"></main>

    <!-- View: orders queue. Owner: Member 2 -->
    <section class="orders-view" hidden></section>

    <!-- View: sales history. Owner: Member 2 -->
    <section class="history-view" hidden></section>

    <!-- View: menu availability. Owner: Member 3 -->
    <section class="menu-view" hidden></section>

    <!-- View: admin (PIN gate + add/edit/remove products). Owner: Member 3 -->
    <section class="admin-view" hidden></section>
  </div>
   <section class="qr-section">
    <h2>QR Code Ordering</h2>
    <p>Scan this QR code to order food.</p>

    <div id="qrcode"></div>

    <button onclick="generateQR()">
        Generate QR Code
    </button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function generateQR() {
    document.getElementById("qrcode").innerHTML = "";

    const orderingLink =
        "https://YOUR-WEBSITE.com/customer-order.html?table=1";

    new QRCode(document.getElementById("qrcode"), {
        text: orderingLink,
        width: 200,
        height: 200
    });
}
</script>
  <!-- View: checkout (payment form + validation error). Owner: Member 2 -->
  <section class="checkout-view" hidden></section>

  <script type="module" src="js/controller.js"></script>
</body>

</html>
